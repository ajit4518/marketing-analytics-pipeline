# Reads everything from the environment; no secrets live in this file.
# Auth uses Application Default Credentials (gcloud auth or the worker's
# service account).
marketing_analytics:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: marketing
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 600
