version: 2

models:
  - name: mart_campaign_performance
    description: Unified Google Ads and Meta campaign performance per day.
    columns:
      - name: date
        data_tests: [not_null]
      - name: channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["google_ads", "facebook_ads"]
      - name: campaign_id
        data_tests: [not_null]
      - name: spend_usd
        data_tests: [not_null]
